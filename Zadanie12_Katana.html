<html>
  <body>
    <div style="color:green;font-size:39px;">
      <script language="JavaScript"> 
        // Szymon Katana 2P 17.09.2025
        // Zadanie 12
        var D1_kat = prompt("Podaj pierwszy dzień stycznia (1-31):","");
        var D2_kat = prompt("Podaj drugi dzień stycznia (1-31):","");
        var G1_kat = prompt("Podaj pierwszą godzinę (0-23):","");
        var G2_kat = prompt("Podaj drugą godzinę (0-23):","");

        var d1 = parseInt(D1_kat);
        var d2 = parseInt(D2_kat);
        var g1 = parseInt(G1_kat);
        var g2 = parseInt(G2_kat);

        var godz1 = (d1 - 1) * 24 + g1;
        var godz2 = (d2 - 1) * 24 + g2;

        var sekund = (godz2 - godz1) * 3600;

        document.write("Ilość sekund = " + sekund + "<br>");
        
        function okno_zamknij_kat() {
          window.close();
        }
      </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kat()"/>
  </body>
</html>
