<html>
  <body>
    <div style="color:green;font-size:39px;">
      <script language="JavaScript">
        // Szymon Katana 2P 17.09.2025
        // Zadanie 12
        var m_kat = prompt("Podaj liczbę naturalną m:","");
        var m = parseInt(m_kat);
        var m1 = m + 1;
        var m2 = m * (m + 1);
        document.write("1/" + m + " = 1/" + m1 + " + 1/" + m2 + "<br>");
        
        function okno_zamknij_kat() {
          window.close();
        }
      </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kat()"/>
  </body>
</html>
