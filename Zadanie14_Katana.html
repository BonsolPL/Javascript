<html>
  <body>
    <div style="color:green;font-size:50px;">
      <script language="JavaScript">
        var m_kat = prompt("Podaj liczbę naturalną m:","");
        var m = parseInt(m_kat);
        var a = m + 2;
        var b = (m + 1) * (m + 2);
        var c = m * (m + 1);
        document.write("1/" + m + " = 1/" + a + " + 1/" + b + " + 1/" + c + "<br>");
        function okno_zamknij_kat() {
          window.close();
        }
      </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kat()"/>
  </body>
</html>
