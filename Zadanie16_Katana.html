<html>
  <body>
    <div style="color:green;font: size 39px;">
      <script language="JavaScript">
        var A = prompt("Podaj pierwszą liczbę A=","");
        var B = prompt("Podaj drugą liczbę B=","");
        var a = parseInt(A);
        var b = parseInt(B);

        document.write("Wczytane liczby: A=" + a + " B=" + b + "<br><br>");

        var czesc1 = Math.pow(a,3);
        var czesc2 = 3 * Math.pow(a,2) * b;
        var czesc3 = 3 * a * Math.pow(b,2);
        var czesc4 = Math.pow(b,3);

        var suma = czesc1 + czesc2 + czesc3 + czesc4;

        document.write("(" + a + " + " + b + ")^3 = " 
                       + a + "^3 + 3*" + a + "^2*" + b 
                       + " + 3*" + a + "*" + b + "^2 + " + b + "^3 = "
                       + czesc1 + " + " + czesc2 + " + " + czesc3 + " + " + czesc4 
                       + " = " + suma);
        
        function okno_zamknij_kat() {
          window.close();
        }
      </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_kat()"/>
  </body>
</html>
