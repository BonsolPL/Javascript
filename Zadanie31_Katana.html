<html>
 <head>
 <script type="text/javascript">
 var monitor = {
Marka: 'Samsung',
Cale: '23,5"',
Rozdzielczosc: '1920x1080',
monitor_wyswietl_Katana: function ()
{
 document.write(this.Marka + ' ' + this.Cale + ' ' + this.Rozdzielczosc)
 }
}
monitor.monitor_wyswietl_Katana();
monitor.odswiezanie=144
monitor.monitor_pokaz_Katana=function () {alert('Częstotliwość odświeżania: ' + this.odswiezanie + 'Hz')}
monitor.monitor_pokaz_Katana();
 </script>
 </head>
<body>
<br>
 Programowanie obiektowe. <br>
 Obiekt to monitor<br>
 Pola: Marka, Cale, Rozdzielczość<br>
 Marka: Samsung <br>
 Cale: 23,5"<br>
 Rozdzielczość: 1920x1080<br>
 metoda: monitor_wyswietl_Katana();<br>
 nowe pole to odświeżanie <br>
 nowa metoda to monitor_pokaz_Katana(); <br>
</body>
</html>
