<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie35_Katana
    </title>
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var x_kat = prompt("podaj liczbę x=","");
                 var a_kat = parseFloat(x_kat);
    
             document.write("czytana liczba x=" + a_kat + "<br>");
    
             if (a_kat > 0) {
              document.write("czytana liczba jest większa od 0" + "<br>");
              } 
             else if (a_kat == 0) {
                document.write("czytana liczba jest równa 0" + "<br>");
              } 
              else if (a_kat < 0) {
              document.write("czytana liczba jest mniejsza od 0" + "<br>");
               } 
        </script>
    </div>
</body>
</html>
