<!DOCTYPE html>
 <head>
 <title>Zadanie46_Katana</title>
 <meta charset="utf-8">
 </head>
<body>
<div style="color:red;font-size:50px;">
 <script language="JavaScript">
 do {
var liczba1_kat=prompt("wysokość=","");
 var h_kat=parseFloat(liczba1_kat);
 }
 while ( h_kat<=0);
 do {
var liczba1_kat=prompt("podstawę=","");
 var a_kat=parseFloat(liczba1_kat);
 }
 while(!( a_kat>0));
var Pole=a_kat*h_kat/2;
 document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>");
 </script>
</div>
</body>
</html>
