<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zadanie51</title>
</head>
<body>
    <script>
        var ile_razy_kat = prompt("Ile razy powtórzyć napis?",);
        var tekst_kat = prompt("Podaj twoje inicjały",);
        
        for (var i_kat = 1; i_kat <= ile_razy_kat; i_kat++) {
            for (var k_kat = 1; k_kat <= i_kat; k_kat++) {
                document.write("&nbsp;");
            }
            document.write(i_kat + "_" + tekst_kat + "_" + i_kat + "<br>");
        }
    </script>
</body>
</html>
