    <p><b>1. Wymień cztery sposoby wyprowadzania danych w JS:</b></p>

    <p><b>2. Czym jest funkcja w JS? Omów przy użyciu 4 podpunktów:</b></p>
    <ul>
        <li>Jest to zbiór zgrupowanych instrukcji, które możemy uruchamiać poprzez podanie ich nazwy</li>
        <li>Każda funkcja po wywołaniu wykonuje swój wewnętrzny kod</li>
        <li>Funkcja może mieć argumenty, które wchodzą do wnętrza funkcji i są tam przetwarzane np. suma_kry(a, b)</li>
        <li>Może (nie zawsze) zwrócić obliczoną wartość zapisaną po słowie kluczowym return</li>
    </ul>

    <p><b>3. Omów metody getElementsByName, getElementById, getElementByTagName:</b></p>
    <table>
        <tr>
            <th>Metoda</th>
            <th>Opis</th>
        </tr>
        <tr>
            <td>getElementById("id")</td>
            <td>Dostęp do elementu o konkretnej wartości atrybutu id</td>
        </tr>
        <tr>
            <td>getElementsByTagName("znacznik")</td>
            <td>Dostęp do wszystkich elementów o typie znacznika, np. P lub DIV</td>
        </tr>
        <tr>
            <td>getElementsByName("nazwa")</td>
            <td>Dostęp do wszystkich elementów o konkretnej wartości atrybutu name</td>
        </tr>
    </table>

    <p><b>4. Omów właściwości innerHTML, innerText, className:</b></p>
    <ul>
        <li>innerHTML – umożliwia odczyt, modyfikowanie, wstawienie lub usunięcie kodu HTML z elementu</li>
        <li>innerText – umożliwia określenie ciągu znaków, który zostanie umieszczony w elemencie</li>
        <li>className – umożliwia określenie klasy CSS użytej do prezentacji elementu</li>
