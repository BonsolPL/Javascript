<h1>Zadanie 28 – Wprowadzenie do paradygmatów programowania</h1>

<h2>1. Główne paradygmaty programowania</h2>
<p>Podstawowe podejścia w programowaniu to: 
1) Programowanie strukturalne, 
2) Programowanie obiektowe.</p>

<h2>2. Istota programowania strukturalnego</h2>
<p>Programowanie strukturalne to metodologia opierająca się na podziale kodu na procedury oraz hierarchicznie zorganizowane bloki, wykorzystujące struktury sterujące takie jak instrukcje warunkowe i iteracje. 
Podejście to znacząco poprawia przejrzystość i ułatwia analizę programów, stanowiąc duży krok naprzód w porównaniu z trudnym w debugowaniu „spaghetti code” powstającym przy nadużywaniu instrukcji <code>goto</code>.</p>

<h3>Podstawowe zasady programowania strukturalnego:</h3>
<ol>
<li>Bloki kodu posiadają jeden punkt wejścia (dopuszcza się wiele punktów wyjścia).</li>
<li>Instrukcje wykonywane są sekwencyjnie.</li>
<li>Stosowanie instrukcji warunkowych (<code>if</code>, <code>if else</code>).</li>
<li>Wykorzystywanie pętli (<code>for</code>, <code>while</code>, <code>do while</code>).</li>
<li>Minimalizowanie użycia instrukcji <code>goto</code>.</li>
<li>Ograniczanie stosowania instrukcji <code>break</code> i <code>continue</code>.</li>
<li>Funkcje i zmienne pozostają od siebie niezależne.</li>
</ol>

<h2>3. Podstawy programowania obiektowego</h2>
<p>Programowanie obiektowe (ang. <b>object-oriented programming</b>) to paradygmat, w którym programy definiuje się za pomocą obiektów posiadających stan (pola) i zachowanie (metody). 
Jest to podejście uważane za bardziej intuicyjne, ponieważ modeluje rzeczywistość – w pamięci komputera tworzone są obiekty instancjonowane z klas, wyposażone w określone atrybuty i funkcjonalności.</p>

<p>Obiekty są tworzone przez programistę i mogą być usuwane, posiadają stan (np. rozmiar okna aplikacji) oraz zachowanie (np. operacja zmiany rozmiaru). 
Program obiektowy stanowi kolekcję obiektów komunikujących się między sobą w celu wykonania określonych zadań.</p>

<h2>4. Zalety programowania obiektowego</h2>
<ul>
<li>Podejście lepiej odwzorowujące świat rzeczywisty (np. obiekt 'samochód' zawiera pola: marka, kolor, rok produkcji oraz metody: hamuj, przyspiesz).</li>
<li>Efektywniejsze zarządzanie pamięcią – nieużywane obiekty mogą być usuwane, zwalniając zasoby systemowe.</li>
<li>Możliwość wielokrotnego wykorzystania kodu – dobrze zaprojektowana klasa może być używana przez różnych programistów.</li>
<li>Łatwiejsza konserwacja i rozbudowa oprogramowania dzięki modularnej strukturze kodu.</li>
</ul>

<h2>5. Terminologia programowania obiektowego</h2>

<p><b>Klasa (ang. class)</b> – szablon definiujący strukturę i zachowanie obiektów; zawiera deklaracje pól i metod.</p>

<p><b>Obiekt (ang. object)</b> – konkretna instancja klasy, posiadająca atrybuty (pola) i funkcjonalności (metody).</p>

<p><b>Właściwość (ang. property)</b> – cecha charakterystyczna obiektu, np. kolor, rozmiar.</p>

<p><b>Metoda (ang. method)</b> – operacja, którą może wykonać obiekt, np. zmiana koloru, przesunięcie.</p>

<p><b>Konstruktor (ang. constructor)</b> – specjalna metoda wywoływana podczas tworzenia obiektu, inicjująca jego stan początkowy.</p>

<p><b>Dziedziczenie (ang. inheritance)</b> – mechanizm pozwalający na tworzenie nowych klas w oparciu o istniejące, przejmujące ich właściwości i metody z możliwością rozszerzania.</p>

<p><b>Hermetyzacja (ang. encapsulation)</b> – zasada ukrywania wewnętrznej implementacji klasy przed światem zewnętrznym, analogicznie do działania przedmiotów w rzeczywistości.</p>

<p><b>Polimorfizm (ang. polymorphism)</b> – zdolność obiektów do przyjmowania różnych form; ta sama metoda może działać inaczej w zależności od kontekstu lub parametrów.</p>
